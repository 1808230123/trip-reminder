<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(256,248)" fill="white">
    <!-- Calendar body -->
    <rect x="-132" y="-108" width="264" height="216" rx="18" fill="none" stroke="white" stroke-width="14"/>
    <!-- Calendar header -->
    <rect x="-118" y="-108" width="236" height="52" rx="12" fill="white" opacity="0.25"/>
    <!-- Separator -->
    <line x1="-118" y1="-56" x2="118" y2="-56" stroke="white" stroke-width="4" opacity="0.4"/>
    <!-- Hanging pins -->
    <line x1="-40" y1="-140" x2="-40" y2="-108" stroke="white" stroke-width="6"/>
    <circle cx="-40" cy="-148" r="10" fill="white"/>
    <line x1="40" y1="-140" x2="40" y2="-108" stroke="white" stroke-width="6"/>
    <circle cx="40" cy="-148" r="10" fill="white"/>
    <!-- Schedule items with colored dots -->
    <circle cx="-100" cy="-20" r="8" fill="#3B82F6"/>
    <line x1="-86" y1="-20" x2="30" y2="-20" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
    <circle cx="-100" cy="20" r="8" fill="#10B981"/>
    <line x1="-86" y1="20" x2="60" y2="20" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
    <circle cx="-100" cy="60" r="8" fill="#8B5CF6"/>
    <line x1="-86" y1="60" x2="10" y2="60" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
    <!-- Notification badge -->
    <circle cx="130" cy="108" r="28" fill="#EF4444"/>
    <!-- Bell icon inside badge -->
    <path d="M130,92 C126,92 122,96 122,100 L122,106 L138,106 L138,100 C138,96 134,92 130,92 Z" fill="white"/>
    <circle cx="130" cy="90" r="4" fill="white"/>
    <ellipse cx="130" cy="108" rx="6" ry="3" fill="white"/>
  </g>
</svg>